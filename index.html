<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorlu Digital | Dijital Çözüm Ortağınız</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* TEMEL AYARLAR */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f172a; /* Koyu modern arka plan */
            color: #f8fafc;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* HEADER & LOGO */
        header {
            background-color: rgba(15, 23, 42, 0.9);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            color: #38bdf8; /* Dikkat çekici dijital mavi */
            letter-spacing: 1px;
        }
        .logo span {
            color: #f8fafc;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }
        nav ul li a {
            font-size: 16px;
            font-weight: 400;
            transition: color 0.3s;
        }
        nav ul li a:hover {
            color: #38bdf8;
        }

        /* HERO BÖLÜMÜ (ANA EKRAN) */
        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .hero h1 span {
            color: #38bdf8;
        }
        .hero p {
            font-size: 18px;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 40px auto;
        }

        /* İLETİŞİM FORMU (FORMSPREE) */
        .contact-section {
            padding: 80px 20px;
            background-color: #0f172a;
            text-align: center;
        }
        .contact-section h2 {
            font-size: 36px;
            margin-bottom: 40px;
        }
        .contact-form {
            max-width: 500px;
            margin: 0 auto;
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #38bdf8;
        }
        .submit-btn {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            font-size: 16px;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #0284c7;
            color: white;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #020617;
            color: #64748b;
            font-size: 14px;
        }

        /* MOBİL UYUM */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <!-- ÜST MENÜ -->
    <header>
        <div class="logo">Zorlu <span>Digital</span></div>
        <nav>
            <ul>
                <li><a href="#">Ana Sayfa</a></li>
                <li><a href="#iletisim">İletişim</a></li>
            </ul>
        </nav>
    </header>

    <!-- ANA EKRAN -->
    <section class="hero">
        <h1>Markanızı <span>Dijitalde</span> Büyütüyoruz</h1>
        <p>Zorlu Digital olarak sosyal medya yönetimi, web tasarım ve dijital pazarlama çözümleriyle işinizi bir sonraki seviyeye taşıyoruz.</p>
    </section>

    <!-- İLETİŞİM FORMU -->
    <section id="iletisim" class="contact-section">
        <h2>Bizimle İletişime Geçin</h2>
        
        <!-- FORMSPREE BAĞLANTISI -->
        <div class="contact-form">
            <form action="https://formspree.io/digitalzorlu@gmail.com" method="POST">
                
                <div class="input-group">
                    <label for="name">Adınız Soyadınız</label>
                    <input type="text" id="name" name="name" required placeholder="Adınız">
                </div>
                
                <div class="input-group">
                    <label for="email">E-Posta Adresiniz</label>
                    <input type="email" id="email" name="_replyto" required placeholder="ornek@mail.com">
                </div>
                
                <div class="input-group">
                    <label for="message">Mesajınız</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Size nasıl yardımcı olabiliriz?"></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Mesaj Gönder</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Zorlu Digital. Tüm Hakları Saklıdır.</p>
        <p>digitalzorlu@gmail.com</p>
    </footer>

</body>
</html>
