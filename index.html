<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zorlu Dijital</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0B0F17;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .slider-container {
      position: relative;
      width: 90%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid #1E293B;
    }

    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .slide {
      min-width: 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(19, 26, 38, 0.8);
      color: #00D2FF;
      border: 1px solid #0066FF;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .nav-btn:hover {
      background: #0066FF;
      color: #FFFFFF;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
    }

    .prev { left: 20px; }
    .next { right: 20px; }

    .dots-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .dot {
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .dot.active {
      background: #00D2FF;
      width: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #00D2FF;
    }
  </style>
</head>
<body>

  <div class="slider-container">
    <div class="slides" id="slideTrack">
      <div class="slide"><img src="foto1.png" alt="Mimari Yapay Zeka"></div>
      <div class="slide"><img src="foto2.png" alt="Canlı Video Sunumu"></div>
      <div class="slide"><img src="foto3.png" alt="Dijital Pazarlama"></div>
      <div class="slide"><img src="foto4.png" alt="Sosyal Medya Etkileşim"></div>
      <div class="slide"><img src="foto5.png" alt="Proje İş Birliği"></div>
    </div>

    <button class="nav-btn prev" id="prevBtn">&#10094;</button>
    <button class="nav-btn next" id="nextBtn">&#10095;</button>

    <div class="dots-container" id="dotsContainer">
      <div class="dot active" data-index="0"></div>
      <div class="dot" data-index="1"></div>
      <div class="dot" data-index="2"></div>
      <div class="dot" data-index="3"></div>
      <div class="dot" data-index="4"></div>
    </div>
  </div>

  <script>
    const track = document.getElementById('slideTrack');
    const dots = document.querySelectorAll('.dot');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    let currentIndex = 0;
    const totalSlides = 5;

    function updateSlider(index) {
      currentIndex = index;
      track.style.transform = `translateX(-${currentIndex * 100}%)`;
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    nextBtn.addEventListener('click', () => {
      let nextIndex = (currentIndex + 1) % totalSlides;
      updateSlider(nextIndex);
    });

    prevBtn.addEventListener('click', () => {
      let prevIndex = (currentIndex - 1 + totalSlides) % totalSlides;
      updateSlider(prevIndex);
    });

    dots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        const index = parseInt(e.target.dataset.index);
        updateSlider(index);
      });
    });

    // Otomatik Kaydırma (5 Saniyede Bir)
    setInterval(() => {
      let nextIndex = (currentIndex + 1) % totalSlides;
      updateSlider(nextIndex);
    }, 5000);
  </script>

</body>
</html>
